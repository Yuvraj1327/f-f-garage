[project]
name = "ff-garage-backend"
version = "0.1.0"
description = "FastAPI backend for the F&F Two Wheeler Garage doorstep servicing app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from a helper module are "redefined" by the test arguments.
"tests/*" = ["F811"]
