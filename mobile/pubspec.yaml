name: ff_garage
description: F&F Two Wheeler Garage - doorstep bike and scooter servicing (customer app and driver panel).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^14.8.1
  # HTTP client for the FastAPI backend
  dio: ^5.7.0
  # Supabase Auth only (anon key). All data access goes through FastAPI.
  supabase_flutter: ^2.8.0
  # Razorpay checkout window (payments are always verified by the backend).
  razorpay_flutter: ^1.3.7
  # Call / WhatsApp / email / map links on the Help & support screen.
  url_launcher: ^6.3.1
  # Loads the public app settings from the bundled .env file.
  flutter_dotenv: ^5.2.1
  # "Continue with Google" on Android and iOS (Web uses Supabase's redirect).
  # Pinned below 7: that release changed the sign-in API this code is written for.
  google_sign_in: ^6.2.2
  # Map picker and map previews (booking, driver job). Keys: see README.
  google_maps_flutter: ^2.9.0
  # "Use my current location", with permission handling.
  geolocator: ^13.0.2
  # Remembers that the first-run onboarding was seen.
  shared_preferences: ^2.3.2
  # Gallery / camera pictures for the admin service editor.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    # Inter (SIL Open Font License, see assets/fonts/OFL-Inter.txt)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    # Brand logo and onboarding hero (see assets/images)
    - assets/images/
    - assets/images/services/
    # Public settings only (see .env.example). Create it with: cp .env.example .env
    - .env
